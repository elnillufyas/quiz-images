<style>

<script>
window.addEventListener('error', function(e){
  var b = document.getElementById('err-banner');

    b.style.display = 'block';

const CDN_BASE = "https://cdn.jsdelivr.net/gh/elnillufyas/quiz-images@main/";
const V = "?v=6";

function cdn(fileName){
  return CDN_BASE + encodeURIComponent(fileName) + V;
}

const IMG1  = cdn("1.jpg");
const IMG2  = cdn("2.jpg");
const IMG3  = cdn("3.jpg");
const IMG4  = cdn("4.jpeg");
const IMG5  = cdn("5.jpg");
const IMG6  = cdn("6.jpg");
const IMG7  = cdn("7.jpg");
const IMG8  = cdn("8.jpg");
const IMG9  = cdn("9.jpg");
const IMG10 = cdn("10.jpg");

const IMG11 = cdn("11 ждуля.jpg");
const IMG12 = cdn("12 ждуля.jpg");
const IMG13 = cdn("13 ждуля.jpg");
const IMG14 = cdn("14 мама в 16.jpg");
const IMG15 = cdn("15 мама в 16.jpg");
const IMG16 = cdn("16 беремена по обману.jpg");
const IMG17 = cdn("17 беремена по обману.jpg");

const OPTIONS = ["ждуля", "беременна в 16", "беременна по обману"];
const LETTERS = ["А", "Б", "В"];

const QUESTION_POOL = [
  { image: IMG1,  correct: "беременна в 16" },
  { image: IMG2,  correct: "беременна в 16" },
  { image: IMG3,  correct: "беременна в 16" },
  { image: IMG4,  correct: "беременна в 16" },
  { image: IMG5,  correct: "беременна по обману" },
  { image: IMG6,  correct: "беременна по обману" },
  { image: IMG7,  correct: "беременна по обману" },
  { image: IMG8,  correct: "ждуля" },
  { image: IMG9,  correct: "ждуля" },
  { image: IMG10, correct: "ждуля" },

  { image: IMG11, correct: "ждуля" },
  { image: IMG12, correct: "ждуля" },
  { image: IMG13, correct: "ждуля" },
  { image: IMG14, correct: "беременна в 16" },
  { image: IMG15, correct: "беременна в 16" },
  { image: IMG16, correct: "беременна по обману" },
  { image: IMG17, correct: "беременна по обману" }
];

const QUESTIONS_PER_GAME = 10;

const QUOTES = {
  low: [
    { text: "«А две полоски — это один ребёнок или два?»",
      show: "Беременна в 16" },
    { text: "«Я не знала, что всё будет настолько тяжело»",
      show: "Мама в 16" },
    { text: "«Мне никто не объяснил, как это всё работает»",

    { text: "«Я вообще не понимаю, что тут происходит»",
      show: "Ждули" }

  mid: [
    { text: "«На воле они какие-то разбалованные все»",

    { text: "«Родители сначала были против, потом смирились»",
      show: "Беременна в 16" },
    { text: "«Было страшно, но я как-то справилась»",
      show: "Мама в 16" },
    { text: "«Я стала взрослой очень рано»",
      show: "Мама в 16" }
  ],
  good: [
    { text: "«Я его дождусь, что бы ни случилось»",

    { text: "«Я справлюсь, я сильная»",
      show: "Беременна в 16" },
    { text: "«Мой ребёнок — это лучшее, что со мной случилось»",
      show: "Мама в 16" },
    { text: "«Мы распишемся сразу, как только его выпустят»",
      show: "Ждули" }
  ],
  great: [
    { text: "«Я его дождалась, и теперь мы вместе навсегда»",
      show: "Ждули" },
    { text: "«Я не жалею ни о чём, я счастлива»",
      show: "Мама в 16" },
    { text: "«Моя дочь — моя жизнь, и это моё лучшее решение»",
      show: "Беременна в 16" },
    { text: "«Я горжусь собой, что не сдалась»",
      show: "Мама в 16" }
  ],
  perfect: [
    { text: "«Я его дождалась, и теперь мы вместе навсегда»",
      show: "Ждули" },
    { text: "«Это было тяжело, но я счастлива как никогда»",
      show: "Мама в 16" },
    { text: "«Мой сын — самое лучшее, что со мной случилось»",
      show: "Беременна в 16" }
  ]
};

const TIMER_SECONDS = 20;

const ladderEl      = document.getElementById('ladder');
const qCounter      = document.getElementById('q-counter');
const scoreEl       = document.getElementById('score');
const scoreBox      = document.querySelector('.score-box');
const qCard         = document.getElementById('q-card');
const mImage        = document.getElementById('m-image');
const mPlaceholder  = document.getElementById('m-placeholder');
const timerFill     = document.getElementById('timer-fill');
const optionsEl     = document.getElementById('options');
const btnReset      = document.getElementById('reset');
const btnSound      = document.getElementById('btn-sound');
const warnBanner    = document.getElementById('warn-banner');

let state = { idx: 0, score: 0, locked: false, finished: false, timerId: null, timeLeft: TIMER_SECONDS };
let totalScore = 0;
let sessionQuestions = [];

function shuffleArray(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildSession(){
  const shuffled = shuffleArray(QUESTION_POOL);
  const picked = shuffled.slice(0, QUESTIONS_PER_GAME);
  return picked.map((q, i) => ({
    value: (i + 1) * 100,
    image: q.image,
    correct: q.correct
  }));
}

function pickQuote(correctCount){
  let tier;
  if (correctCount <= 2)       tier = QUOTES.low;
  else if (correctCount <= 4)  tier = QUOTES.mid;
  else if (correctCount <= 6)  tier = QUOTES.good;
  else if (correctCount <= 8)  tier = QUOTES.great;
  else                         tier = QUOTES.perfect;

  const q = tier[Math.floor(Math.random() * tier.length)];
  const parts = [q.show];
  if (q.season != null)  parts.push("сезон " + q.season);
  if (q.episode != null) parts.push("серия " + q.episode);
  return { source: parts.join(", "), text: q.text };
}

let soundEnabled = true;
try {
  const saved = localStorage.getItem('quiz_sound');
  if (saved === 'off') soundEnabled = false;
} catch(e){}

function updateSoundBtn(){
  btnSound.textContent = soundEnabled ? '🔊' : '🔇';
  btnSound.classList.toggle('muted', !soundEnabled);
}
updateSoundBtn();

btnSound.addEventListener('click', () => {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem('quiz_sound', soundEnabled ? 'on' : 'off'); } catch(e){}
  updateSoundBtn();
  if (soundEnabled) playCorrect();
});

let audioCtx = null;
function ensureAudio(){
  if (audioCtx) return audioCtx;
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  } catch(e){ audioCtx = null; }
  return audioCtx;
}
function unlockAudioOnFirstGesture(){
  const ctx = ensureAudio();
  if (ctx && ctx.state === 'suspended') ctx.resume().catch(()=>{});
}
document.addEventListener('touchstart', unlockAudioOnFirstGesture, {once:true, passive:true});
document.addEventListener('click',      unlockAudioOnFirstGesture, {once:true});

function playTone(notes, type, duration, volume){
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
  const now = ctx.currentTime;
  notes.forEach((freq, i) => {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, now + i*0.09);
    g.gain.setValueAtTime(0, now + i*0.09);
    g.gain.linearRampToValueAtTime(volume || 0.22, now + i*0.09 + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, now + i*0.09 + (duration || 0.4));
    o.connect(g).connect(ctx.destination);
    o.start(now + i*0.09);
    o.stop(now + i*0.09 + (duration || 0.4) + 0.1);
  });
}
function playCorrect(){ playTone([660, 880, 1320], 'sine', 0.4, 0.22); }
function playWrong(){
  if (!soundEnabled) return;
  const ctx = ensureAudio(); if (!ctx) return;
  if (ctx.state === 'suspended') ctx.resume().catch(()=>{});
  const now = ctx.currentTime;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sawtooth';
  o.frequency.setValueAtTime(200, now);
  o.frequency.exponentialRampToValueAtTime(70, now + 0.5);
  g.gain.setValueAtTime(0, now);
  g.gain.linearRampToValueAtTime(0.2, now + 0.03);
  g.gain.exponentialRampToValueAtTime(0.0001, now + 0.55);
  o.connect(g).connect(ctx.destination);
  o.start(now);
  o.stop(now + 0.6);
}
function playWin(){ playTone([523, 659, 784, 1046, 1318], 'triangle', 0.45, 0.25); }
function vibrate(pattern){
  if (!soundEnabled) return;
  if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e){} }
}

function renderLadder(){
  ladderEl.innerHTML = '';
  sessionQuestions.forEach((q, i) => {
    const el = document.createElement('div');
    el.className = 'step';
    el.textContent = q.value;
    if (state.finished && i === state.idx) el.classList.add('wrong-step');
    else if (i < state.idx) el.classList.add('done');
    else if (i === state.idx && !state.finished) el.classList.add('current');
    ladderEl.appendChild(el);
  });
  const cur = ladderEl.querySelector('.current, .wrong-step');
  if (cur && cur.scrollIntoView) cur.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
}

function displayQuestionImage(url, number){
  mPlaceholder.style.display = 'flex';
  mPlaceholder.innerHTML =
    '<div class="ph-num">' + number + '</div>' +
    '<div class="ph-note">Загрузка картинки…</div>' +
    '<div class="ph-spinner"></div>';
  mPlaceholder.onclick = null;

  mImage.style.display = 'none';
  mImage.removeAttribute('src');
  mImage.onload = null;
  mImage.onerror = null;
  delete mImage.dataset.retried;

  mImage.onload = function(){
    mImage.style.display = 'block';
    mPlaceholder.style.display = 'none';
  };

  mImage.onerror = function(){
    const retryUrl = url + (url.indexOf('?') === -1 ? '?' : '&') + 'r=' + Date.now();
    if (!mImage.dataset.retried){
      mImage.dataset.retried = '1';
      mImage.src = retryUrl;
      return;
    }
    delete mImage.dataset.retried;
    mPlaceholder.innerHTML =
      '<div class="ph-num">' + number + '</div>' +
      '<div class="ph-note">Не удалось загрузить.<br>Нажми, чтобы повторить.</div>';
    mPlaceholder.onclick = function(){
      mPlaceholder.onclick = null;
      displayQuestionImage(url, number);
    };
  };

  mImage.src = url;
}

function showQuestion(){
  if (state.idx >= sessionQuestions.length){ endGame(true); return; }

  const q = sessionQuestions[state.idx];
  const number = state.idx + 1;
  qCounter.textContent = number + " / " + sessionQuestions.length;

  displayQuestionImage(q.image, number);

  optionsEl.innerHTML = '';
  OPTIONS.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'option';

    const letterSpan = document.createElement('span');
    letterSpan.className = 'letter';
    letterSpan.textContent = LETTERS[i];

    const textSpan = document.createElement('span');
    textSpan.textContent = opt;

    btn.appendChild(letterSpan);
    btn.appendChild(textSpan);
    btn.addEventListener('click', () => selectOption(btn, opt, q.correct));
    optionsEl.appendChild(btn);
  });

  state.locked = false;
  startTimer();
}

function startTimer(){
  clearInterval(state.timerId);
  state.timeLeft = TIMER_SECONDS;
  updateTimerBar();
  state.timerId = setInterval(() => {
    state.timeLeft -= 0.1;
    if (state.timeLeft <= 0){
      state.timeLeft = 0;
      updateTimerBar();
      clearInterval(state.timerId);
      timeUp();
    } else {
      updateTimerBar();
    }
  }, 100);
}
function updateTimerBar(){
  const pct = (state.timeLeft / TIMER_SECONDS) * 100;
  timerFill.style.width = pct + '%';
  timerFill.classList.toggle('danger', state.timeLeft <= 5);
}
function stopTimer(){ clearInterval(state.timerId); state.timerId = null; }

function timeUp(){
  if (state.locked || state.finished) return;
  state.locked = true;
  const q = sessionQuestions[state.idx];
  optionsEl.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent.indexOf(q.correct) !== -1) btn.classList.add('correct');
    else btn.classList.add('dimmed');
  });
  qCard.classList.add('shake');
  setTimeout(() => qCard.classList.remove('shake'), 500);
  playWrong();
  vibrate([100, 50, 100]);
  setTimeout(() => endGame(false, 'Время вышло'), 1600);
}

function selectOption(chosenBtn, option, correctOption){
  if (state.locked || state.finished) return;
  state.locked = true;
  stopTimer();

  const isCorrect = option === correctOption;
  const q = sessionQuestions[state.idx];

  optionsEl.querySelectorAll('.option').forEach(btn => {
    btn.disabled = true;
    if (btn.textContent.indexOf(correctOption) !== -1) btn.classList.add('correct');
    else if (btn === chosenBtn) btn.classList.add('wrong');
    else btn.classList.add('dimmed');
  });

  if (isCorrect){
    // Прибавляем стоимость только за правильный ответ
    totalScore += q.value;
    state.score = totalScore;
    scoreEl.textContent = String(totalScore);
    showScorePop(q.value);

    playCorrect();
    vibrate(60);
    setTimeout(() => {
      state.idx++;
      renderLadder();
      if (state.idx >= sessionQuestions.length) endGame(true);
      else showQuestion();
    }, 1500);
  } else {
    // Неправильный ответ — счёт НЕ меняется, просто выходим из игры
    playWrong();
    vibrate([120, 60, 120]);
    qCard.classList.add('shake');
    setTimeout(() => qCard.classList.remove('shake'), 500);
    setTimeout(() => endGame(false, 'Неверный ответ'), 1600);
  }
}

function showScorePop(delta){
  const el = document.createElement('span');
  el.className = 'score-pop plus';
  el.textContent = '+' + Math.abs(delta);
  scoreBox.appendChild(el);
  setTimeout(() => el.remove(), 1400);
}

function endGame(won, reason){
  state.finished = true;
  stopTimer();
  renderLadder();

  const scoreFinal = state.score;
  const correctCount = won ? sessionQuestions.length : state.idx;
  const quote = pickQuote(correctCount);

  const screen = document.createElement('div');
  screen.className = 'end-screen';

  const card = document.createElement('div');
  card.className = 'end-card';

  const emoji = document.createElement('div');
  emoji.className = 'end-emoji';
  emoji.textContent = won ? '🏆' : (correctCount >= 6 ? '😎' : correctCount >= 3 ? '😅' : '😔');

  const title = document.createElement('div');
  title.className = 'end-title';
  title.textContent = won ? 'ПОБЕДА!' : 'Игра окончена';

  const scoreLabel = document.createElement('div');
  scoreLabel.className = 'end-score-label';
  scoreLabel.textContent = 'Итоговый счёт';

  const scoreBig = document.createElement('div');
  scoreBig.className = 'end-score';
  scoreBig.textContent = String(scoreFinal);

  const rankBox = document.createElement('div');
  rankBox.className = 'end-rank';

  const rankName = document.createElement('span');
  rankName.className = 'rank-name';
  rankName.textContent = quote.source;

  const rankQuote = document.createElement('span');
  rankQuote.className = 'rank-quote';
  rankQuote.textContent = quote.text;

  rankBox.appendChild(rankName);
  rankBox.appendChild(rankQuote);

  const desc = document.createElement('div');
  desc.className = 'end-desc';
  if (won){
    desc.textContent = 'Правильных ответов: ' + sessionQuestions.length + ' из ' + sessionQuestions.length + '. Идеально!';
  } else {
    const why = reason || 'Ошибка';
    desc.textContent = why + '. Правильных ответов: ' + correctCount + ' из ' + sessionQuestions.length + '.';
  }

  const btnPlay = document.createElement('button');
  btnPlay.className = 'btn-play';
  btnPlay.type = 'button';
  btnPlay.textContent = 'Играть снова';
  btnPlay.addEventListener('click', () => { screen.remove(); resetGame(); });

  card.appendChild(emoji);
  card.appendChild(title);
  card.appendChild(scoreLabel);
  card.appendChild(scoreBig);
  card.appendChild(rankBox);
  card.appendChild(desc);
  card.appendChild(btnPlay);
  screen.appendChild(card);
  document.body.appendChild(screen);

  if (won){
    playWin();
    vibrate([80, 40, 80, 40, 200]);
    launchConfetti();
  }
}

function launchConfetti(){
  const canvas = document.createElement('canvas');
  canvas.className = 'confetti-canvas';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d');
  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  const W = window.innerWidth, H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
  ctx.scale(DPR, DPR);

  const colors = ['#fbbf24', '#34d399', '#60a5fa', '#f472b6', '#a78bfa', '#f87171'];
  const particles = [];
  for (let i = 0; i < 140; i++){
    particles.push({
      x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
      vx: (Math.random() - 0.5) * 3, vy: Math.random() * 2.5 + 1.5,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 0.25
    });
  }
  let frames = 0;
  function tick(){
    frames++;
    ctx.clearRect(0, 0, W, H);
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.rot += p.vrot;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
      ctx.restore();
    });
    if (frames < 220) requestAnimationFrame(tick);
    else canvas.remove();
  }
  tick();
}

function resetGame(){
  state = { idx: 0, score: 0, locked: false, finished: false, timerId: null, timeLeft: TIMER_SECONDS };
  totalScore = 0;
  scoreEl.textContent = '0';
  sessionQuestions = buildSession();
  renderLadder();
  showQuestion();
}

btnReset.addEventListener('click', () => {
  const screen = document.querySelector('.end-screen');
  if (screen) screen.remove();
  resetGame();
});

resetGame();
</script>
